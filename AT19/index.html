<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Custo</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script> 
</head>
<body>

    <header id="cabecalho">
        <h1>Calculadora de Custo</h1>
    </header>

    <div id="painel">
        <input type="text" id="nomeCliente" placeholder="Usuário">
        <input type="text" id="nomeProduto" placeholder="Digite o produto">
        <input type="number" id="precoProduto" placeholder="Preço unitário">
        <input type="number" id="quantidadeProduto" placeholder="Quantidade">
        <button id="calcular">Calcular</button>
    </div>  

    <div id="relatorio">
        <h2>Relatório</h2>
        <div id="resultado">
            <ul id="listaResultados"></ul>
        </div>
    </div>
    
</body>
</html>
