<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Mudar Fundo com ID</title>
</head>
<body id="meuFundo">

    <button onclick="mudarFundo()">Mudar Fundo para Azul</button>

    <script>
        function mudarFundo() {
            document.getElementById("meuFundo").style.backgroundColor = "blue";
        }
    </script>

</body>
</html>
