<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>


    <input type="text" id="campoTexto" placeholder="Digite algo...">
    <button onclick="mostrarTexto()">Mostrar texto</button>
    
    <script>
        function mostrarTexto() {
            const texto = document.getElementById("campoTexto").value;
            alert("O texto digitado é: " + texto);
        }
    </script>  

</body>
</html>
